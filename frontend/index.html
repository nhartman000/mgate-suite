<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kadmon Visualizer</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      
      body {
        overflow: hidden;
        background: #000;
        font-family: system-ui, -apple-system, sans-serif;
      }
      
      #root {
        width: 100vw;
        height: 100vh;
      }
      
      .hud {
        position: fixed;
        top: 20px;
        left: 20px;
        color: #00ffaa;
        font-family: monospace;
        z-index: 100;
        pointer-events: none;
      }
      
      .hud > div {
        margin: 4px 0;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
